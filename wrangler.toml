# Cloudflare Worker + static assets (out/)
# Dashboard Variables bind to this Worker env (OPENAI_API_KEY, etc.)
name = "toolshub"
main = "workers/router.ts"
compatibility_date = "2024-11-01"

[assets]
directory = "./out"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
